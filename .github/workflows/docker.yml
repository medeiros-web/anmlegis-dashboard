name: Build & Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Portainer
        env:
          PORTAINER_URL: https://portainer.chatatender.ia.br
          PORTAINER_USER: ${{ secrets.PORTAINER_USER }}
          PORTAINER_PASSWORD: ${{ secrets.PORTAINER_PASSWORD }}
          PORTAINER_STACK_ID: 32
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Authenticating with Portainer..."
          TOKEN=$(curl -sf --max-time 15 -X POST "$PORTAINER_URL/api/auth" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$PORTAINER_USER\",\"password\":\"$PORTAINER_PASSWORD\"}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['jwt'])")

          echo "Triggering stack redeploy with pullImage..."
          HTTP_STATUS=$(curl -s --max-time 60 -o /tmp/portainer_resp.json -w "%{http_code}" \
            -X PUT "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID?endpointId=1" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"stackFileContent\": $(cat docker-compose.yml | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),
              \"env\": [
                {\"name\": \"DATABASE_URL\", \"value\": \"$DATABASE_URL\"},
                {\"name\": \"JWT_SECRET\", \"value\": \"$JWT_SECRET\"},
                {\"name\": \"RESEND_API_KEY\", \"value\": \"\"},
                {\"name\": \"NODE_ENV\", \"value\": \"production\"},
                {\"name\": \"PORT\", \"value\": \"3000\"},
                {\"name\": \"SITE_URL\", \"value\": \"https://anmlegis.chatatender.ia.br\"}
              ],
              \"pullImage\": true,
              \"prune\": false
            }")

          echo "Portainer response status: $HTTP_STATUS"
          cat /tmp/portainer_resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Stack:', d.get('Name'), '| Status:', d.get('Status'))" 2>/dev/null || cat /tmp/portainer_resp.json

          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Portainer redeploy failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Portainer redeploy triggered successfully"
